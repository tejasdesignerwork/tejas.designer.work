<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kalari Film Roll</title><style>html,body{margin:0}img{max-width:100%}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme:dark;
  --room:#070504;
  --base:#1a0f09;          /* film base, warm brown-black */
  --base-2:#26160d;
  --edge:#e6a24a;          /* edge-print amber */
  --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--room);touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:fixed;inset:0;overflow:hidden;perspective:1600px;perspective-origin:50% 50%;cursor:grab;background:var(--room)}
.stage.drag{cursor:grabbing}
.stage:focus-visible{outline:none}
/* light table behind the film: sits far back, so it drifts the least */
.backlight{position:absolute;left:50%;top:50%;width:150vw;height:110vh;margin:-55vh 0 0 -75vw;pointer-events:none;will-change:transform;
  background:radial-gradient(ellipse 42% 38% at 50% 50%, rgba(255,190,120,.22), rgba(255,140,60,.07) 45%, rgba(0,0,0,0) 72%)}
.world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.roll{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.frame{position:absolute;width:calc(var(--fw) + 2px);height:var(--fh);left:calc(var(--fw)/-2 - 1px);top:calc(var(--fh)/-2);will-change:transform,filter;
  backface-visibility:hidden;border-radius:2px;
  background:
    linear-gradient(180deg, rgba(255,214,160,.10) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0) calc(100% - 3px), rgba(0,0,0,.55) 100%),
    var(--tex) 0 0/var(--texw) 100%,
    linear-gradient(180deg,#2a170c,#1b0f08 20%,#170c06 80%,#2a170c);
  box-shadow:0 34px 50px -26px rgba(0,0,0,.95), 0 0 0 1px rgba(0,0,0,.35)}

.frame::before{top:0} .frame::after{bottom:0;transform:scaleY(-1)}
.leader{position:absolute;width:calc(var(--fw)*7);height:var(--fh);left:calc(var(--fw)*-3.5);top:calc(var(--fh)/-2);pointer-events:none;
  background:var(--holes-top) 0 0/var(--tile) var(--band) repeat-x, var(--holes-bot) 0 100%/var(--tile) var(--band) repeat-x,
    linear-gradient(180deg,#2a170c,#1b0f08 20%,#170c06 80%,#2a170c);
  filter:brightness(.8)}
.leader::after{content:"";position:absolute;left:0;right:0;top:var(--band);bottom:var(--band);background:#130906;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.edge{position:absolute;left:5%;bottom:calc(var(--band)*.02);font:calc(var(--band)*.2)/1 var(--mono);color:#ffb65e;opacity:.8;letter-spacing:.14em;white-space:nowrap;z-index:3;
  text-shadow:0 0 3px rgba(255,120,30,.9),0 0 8px rgba(255,90,20,.35);filter:blur(.25px)}
.edge.top{top:calc(var(--band)*.04);bottom:auto;left:auto;right:5%}
.code{position:absolute;right:6%;bottom:calc(var(--band)*.06);width:calc(var(--band)*1.3);height:calc(var(--band)*.14);z-index:3;opacity:.75;filter:blur(.3px);
  background:repeating-linear-gradient(90deg,#ffb65e 0 2px,transparent 2px 4px,#ffb65e 4px 5px,transparent 5px 8px,#ffb65e 8px 11px,transparent 11px 13px)}
.card{position:absolute;left:calc(var(--gap)/2 + 1px);right:calc(var(--gap)/2 + 1px);top:var(--band);bottom:var(--band);overflow:hidden;perspective:1400px;perspective-origin:50% 50%;
  background:#120a06;border-radius:calc(var(--band)*.12);
  box-shadow:0 0 0 1px rgba(0,0,0,.75), 0 0 calc(var(--band)*.5) rgba(255,86,24,.28)}   /* halation: light bleeding round the picture */
.card.vcard{background:#000;box-shadow:0 0 0 1px rgba(0,0,0,.75)}
.card.vcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000}
.gate{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 calc(var(--band)*.9) rgba(10,3,0,.75), inset 0 0 2px rgba(0,0,0,.9);
  background:var(--scratch) 0 0/100% 100%;mix-blend-mode:normal;opacity:.9}
.rig{position:absolute;inset:0;transform-style:preserve-3d}
.lay{position:absolute;display:block;max-width:none;pointer-events:none;backface-visibility:hidden}
.base{inset:0;width:100%;height:100%}
.lamp{position:absolute;left:-50%;top:-50%;width:200%;height:200%;z-index:2;pointer-events:none;will-change:transform;
  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,196,120,.20) 0%, rgba(255,160,80,.07) 10%, rgba(0,0,0,0) 17%, rgba(18,6,2,.34) 27%, rgba(12,4,1,.6) 38%, rgba(8,2,0,.74) 50%)}
.lamp i{position:absolute;inset:0;background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,214,150,.14) 0%, rgba(255,214,150,0) 9%);will-change:opacity}
.dim{position:absolute;inset:0;z-index:5;pointer-events:none;background:#000;opacity:0;will-change:opacity}
.grain{position:fixed;inset:-100px;z-index:20;pointer-events:none;opacity:.05;animation:g .6s steps(6) infinite}
@keyframes g{0%{transform:translate(0,0)}20%{transform:translate(-30px,40px)}40%{transform:translate(50px,-20px)}60%{transform:translate(-20px,-60px)}80%{transform:translate(35px,25px)}}
.vig{position:fixed;inset:0;z-index:19;pointer-events:none;background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%)}
@media (prefers-reduced-motion: reduce){ .grain{animation:none} }
</style>

    R=FW*4.2;                                   // radius of the drum the film wraps around
    TH=FW/R;                                    // angle one frame takes on the drum
    frames.forEach(f=>f.o=null);
  }
  size(); addEventListener('resize',size);

  /* ---------- continuous position: scroll, drag, keys; snaps to a frame when you let go ---------- */
  let pos=0, target=0, snapT=null, lastUser=-1e9;
  const vfCentred=()=>{ const p=((pos%N)+N)%N; let o=(N-1)-p; if(o>N/2) o-=N; if(o<-N/2) o+=N; return Math.abs(o)<.08 && Math.abs(target-pos)<.03; };
  const HOLD=4200, IDLE=6000; let nextAdvance=performance.now()+HOLD;
  const touched=()=>{ lastUser=performance.now(); };
  const snapSoon=(ms=160)=>{ clearTimeout(snapT); snapT=setTimeout(()=>{ target=Math.round(target); },ms); };
  stage.addEventListener('wheel',e=>{
    e.preventDefault();
    const dl=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*(e.deltaMode===1?33:1);
    target+=dl/(FW*.9); snapSoon(); touched();
  },{passive:false});
  let drag=null;
  stage.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,t0:target,vx:0,lx:e.clientX,lt:performance.now()}; stage.setPointerCapture(e.pointerId); stage.classList.add('drag'); clearTimeout(snapT); touched(); });
  stage.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=(e.clientX-drag.x)+(e.clientY-drag.y)*.6;
    target=drag.t0-dx/FW;
    const now=performance.now(); drag.vx=(e.clientX-drag.lx)/Math.max(1,now-drag.lt); drag.lx=e.clientX; drag.lt=now;
  });
  const endDrag=(e)=>{
    if(!drag) return;
    const moved=e && Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
    if(e && moved<6 && vfCentred()){                       // a tap on the playing film: sound on / off
      const v=vf.video; v.muted=!v.muted; if(v.paused) v.play().catch(()=>{});
      target=Math.round(target);
    } else target=Math.round(target-drag.vx*260/FW);
    drag=null; stage.classList.remove('drag');
  };
  stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);
  addEventListener('keydown',e=>{
    touched();
    if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();target=Math.round(target)+1;}
    if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();target=Math.round(target)-1;}
  });

  /* ---------- tilt: mouse, or phone orientation ---------- */
  let tx=0,ty=0,last=-1e9,gyro=false,base=null;
  addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse' && !e.buttons && !drag) return; tx=e.clientX/innerWidth*2-1; ty=e.clientY/innerHeight*2-1; last=performance.now(); gyro=false; });
  // touch: the lamp follows your finger while it is on the screen
  addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; tx=e.clientX/innerWidth*2-1; ty=e.clientY/innerHeight*2-1; last=performance.now(); });
  const COARSE=matchMedia('(pointer: coarse)').matches;
  document.addEventListener('pointerleave',()=>{tx=ty=0;});
  const clamp=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v));
  function onTilt(e){
    if(e.beta==null||e.gamma==null) return;
    const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    let lr=e.gamma, fb=e.beta;
    if(ang===90){lr=e.beta; fb=-e.gamma;} else if(ang===-90||ang===270){lr=-e.beta; fb=e.gamma;} else if(ang===180){lr=-e.gamma; fb=-e.beta;}
    if(!base) base={lr,fb};
    base.lr+=(lr-base.lr)*.01; base.fb+=(fb-base.fb)*.01;
    tx=clamp((lr-base.lr)/18); ty=clamp((fb-base.fb)/18); gyro=true; last=performance.now();
  }
  addEventListener('deviceorientation',onTilt);
  const DOE=window.DeviceOrientationEvent;
  if(DOE&&typeof DOE.requestPermission==='function'){
    const ask=()=>{DOE.requestPermission().then(r=>{if(r==='granted')addEventListener('deviceorientation',onTilt);}).catch(()=>{});removeEventListener('touchend',ask);};
    addEventListener('touchend',ask);
  }

  /* ---------- dust drifting in the projector beam, at different depths ---------- */
  const dustBox=document.getElementById('dust'), motes=[];
  for(let i=0;i<18;i++){
    const m=document.createElement('i'), sz=Math.random()*3+1;
    m.style.cssText=`position:absolute;left:50%;top:50%;width:${sz}px;height:${sz}px;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,rgba(255,226,180,${.35+Math.random()*.4}),rgba(255,200,140,0) 70%);filter:blur(${Math.random()*1.2}px)`;
    dustBox.appendChild(m);
    motes.push({m,x:(Math.random()-.5)*innerWidth*1.1,y:(Math.random()-.5)*innerHeight*.9,z:Math.random()*600-100,vx:(Math.random()-.5)*.08,vy:-.02-Math.random()*.06,ph:Math.random()*6});
  }

  /* ---------- frame loop ---------- */
  const AY=reduce?0:2.6, AX=reduce?0:1.8;
  const world=document.getElementById('world'), backlight=document.getElementById('backlight'); let wx=0,wy=0;
  function tick(t){
    // the roll plays on its own: holds each frame, then winds on to the next, forever
    // the film plays when its frame is in the gate, and the roll waits for it to finish
    const v=vf.video, inGate=vfCentred();
    if(inGate && vf.loaded && v.paused && !v.ended && !v._userPaused) v.play().catch(()=>{});
    if(!inGate && !v.paused) v.pause();
    if(inGate && !v.ended) nextAdvance=t+HOLD;
    if(!inGate && v.ended){ v.currentTime=0; }
    if(!drag && t-lastUser>IDLE && Math.abs(target-pos)<.01){
      if(t>=nextAdvance){ target=Math.round(target)+1; nextAdvance=t+HOLD; }
    } else if(drag || t-lastUser<=IDLE){ nextAdvance=t+HOLD; }
    pos += (target-pos)*(reduce?1:.14);
    let gx=tx,gy=ty; if(t-last>2500){ const k=COARSE?1.45:1; gx=Math.sin(t/(COARSE?2400:3100))*.55*k; gy=Math.sin(t/(COARSE?3300:4300))*.35*k; }   // no pointer: the light and tilt drift on their own (stronger on phones)
    wx+=(gx-wx)*(gyro?.1:.05); wy+=(gy-wy)*(gyro?.1:.05);
    const fl=reduce?1:.88+.08*Math.sin(t/97)+.05*Math.sin(t/31+1.3)+.03*Math.random();
    // the whole strip shares the tilt, so film and pictures move as one layered object
    if(!reduce){
      world.style.transform=`translateY(${(Math.sin(t/2900)*4).toFixed(2)}px) rotateY(${(wx*5).toFixed(3)}deg) rotateX(${(-wy*3.6).toFixed(3)}deg) rotateZ(${(Math.sin(t/4100)*.35).toFixed(3)}deg)`;
      backlight.style.transform=`translate(${(wx*-18).toFixed(1)}px,${(wy*-12).toFixed(1)}px)`;
      for(const d of motes){
        d.x+=d.vx; d.y+=d.vy; if(d.y<-innerHeight*.5) d.y=innerHeight*.5; if(Math.abs(d.x)>innerWidth*.6) d.vx*=-1;
        d.m.style.transform=`translate3d(${d.x.toFixed(1)}px,${(d.y+Math.sin(t/1400+d.ph)*6).toFixed(1)}px,${d.z.toFixed(0)}px)`;
        d.m.style.opacity=(.5+.5*Math.sin(t/900+d.ph)).toFixed(2);
      }
    }
    const p=((pos%N)+N)%N;
    const lp=(pos*FW)%FW; document.getElementById('leader').style.transform=`translate3d(${(-lp).toFixed(1)}px,0,-160px) scale(${((1600+160)/1600).toFixed(4)})`;                           // the roll loops: after the last frame comes the first
    frames.forEach((f,k)=>{
      let o=k-p; if(o>N/2) o-=N; if(o<-N/2) o+=N;    // shortest way round the loop
      const e=Math.abs(o);
      if(e>2.3){ if(f.fr.style.visibility!=='hidden') f.fr.style.visibility='hidden'; f.o=null; return; }
      f.fr.style.visibility=''; load(f);
      // film wrapped on a drum: frames stay joined edge to edge and bend away as they travel
      const a=o*TH;
      const sag=0, tw=0;   // kept flat so neighbouring frames stay joined edge to edge
      f.fr.style.transform=`translate3d(${(R*Math.sin(a)).toFixed(1)}px,${sag.toFixed(1)}px,${(R*Math.cos(a)-R).toFixed(1)}px) rotateY(${(a*180/Math.PI).toFixed(3)}deg) rotateX(${tw.toFixed(2)}deg)`;
      const dv=Math.round(Math.min(e,3)*.1*100)/100;
      if(dv!==f.lastDim){ f.dim.style.opacity=dv; f.lastDim=dv; }
      if(f.isVideo) return;
      const w=Math.max(0,1-e*2);
      f.x+=(gx*w-f.x)*(gyro?.12:.06); f.y+=(gy*w-f.y)*(gyro?.12:.06);
      f.rig.style.transform=`rotateY(${(f.x*AY).toFixed(3)}deg) rotateX(${(-f.y*AX).toFixed(3)}deg)`;
      if(e<1.2){      // lamp only needs updating on frames near the gate
        f.lamp.style.transform=`translate3d(${(f.x*.48*CW).toFixed(1)}px,${((f.y*.44-.04)*CW*.5625).toFixed(1)}px,0)`;
        f.flame.style.opacity=fl.toFixed(2);
      }
      if(f.o!==null && Math.abs(f.o-o)<.0005) return;
      f.o=o; const d=clamp(o);
      for(const im of f.lays){
        if(reduce){ im.style.transform=im._base; continue; }
        const r=im._r;
        // peel: the picture's layers slide ahead of the frame and lift toward you as it leaves the gate
        im.style.transform=`translate3d(${(d*CW*.5*r).toFixed(1)}px,0,${(Math.abs(d)*r*320).toFixed(1)}px) ${im._base}`;
        im.style.opacity=(1-clamp(Math.abs(d)*r*1.9-.25,0,1)).toFixed(3);
      }
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // film grain tile
  const c=document.createElement('canvas'); c.width=c.height=160; const cx=c.getContext('2d'), im=cx.createImageData(160,160);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;}
  cx.putImageData(im,0,0); document.getElementById('grain').style.backgroundImage=`url(${c.toDataURL()})`;
  stage.focus();
})();
</script>
</body></html>
