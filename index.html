    <style id="fit-all-screens">
      /* Screen fitting for every device. The room's panels were sized with fixed vh/vw values;
         these overrides keep them inside the visible area on phones, tablets, laptops and big monitors.
         "html body" raises specificity above the app's own injected styles. */
      html, body { height: 100%; }
      html body .ts-ovl { padding: max(40px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      html body .ts-crt-in { height: min(520px, calc(100dvh - 150px)); }
      html body .ts-cam-screen { height: min(500px, calc(100dvh - 170px)); }
      html body .ts-embed-frame { min-height: 160px; }

      /* big monitors (1080p and up): give projects more room */
      @media (min-width: 1600px) and (min-height: 900px) {
        html body .ts-crt { width: min(1180px, 88vw); }
        html body .ts-crt-in { height: min(680px, calc(100dvh - 190px)); }
        html body .ts-cam { width: min(1200px, 88vw); }
        html body .ts-cam-screen { height: min(640px, calc(100dvh - 200px)); }
      }
      /* short screens: phones in landscape, small laptop windows */
      @media (max-height: 560px) {
        html body .ts-ovl { padding-top: 30px; padding-bottom: 8px; }
        html body .ts-close { top: -24px; }
        html body .ts-crt { padding: 8px; }
        html body .ts-crt-in { height: calc(100dvh - 64px); }
        html body .ts-crt-side { width: 150px; font-size: 16px; padding: 10px; }
        html body .ts-crt-body { padding: 10px 12px; }
        html body .ts-embed .meta { display: none; }
        html body .ts-cam { padding: 10px; }
        html body .ts-cam-screen { height: calc(100dvh - 70px); }
      }
      /* phones held upright: the app turns its content sideways, so the visible width is 100vh and height is 100vw */
      /* use the real visible height on iPhone (100vh includes the area behind Safari's bars) */
      html body .ts-rotate-inner { width: 100dvh !important; height: 100dvw !important; }
      html body .ts-rotate-inner .ts-ovl { padding: 30px 12px 8px; }
      html body .ts-rotate-inner .ts-close { top: -24px; }
      html body .ts-rotate-inner .ts-crt { width: min(920px, calc(100vh - 24px)); padding: 8px; }
      html body .ts-rotate-inner .ts-crt-in { height: calc(100vw - 64px); }
      html body .ts-rotate-inner .ts-crt-side { width: 150px; font-size: 16px; padding: 10px; }

      html body .ts-rotate-inner .ts-cam { width: min(960px, calc(100vh - 24px)); flex-direction: row; padding: 10px; }
      html body .ts-rotate-inner .ts-cam-screen { height: calc(100vw - 70px); }

      html body .ts-rotate-inner .ts-contact { width: min(520px, calc(100vh - 32px)); max-height: calc(100vw - 50px); overflow-y: auto; }
      /* tablets held upright (iPad): use the extra height */
      @media (min-width: 700px) and (max-width: 1100px) and (orientation: portrait) {
        html body .ts-crt-in { height: min(760px, calc(100dvh - 220px)); }

    <script>
/* Portfolio analytics tracker — anonymous, no cookies. Sends to the Cloudflare Worker set in PF_ANALYTICS.
   Visit the site once with ?owner=1 to stop counting your own visits on that browser (?owner=0 to undo). */
(function () {
  var EP = window.PF_ANALYTICS || '';
  try {
    var q = location.search;
    if (/[?&]owner=1/.test(q)) localStorage.setItem('pf-owner', '1');
    if (/[?&]owner=0/.test(q)) localStorage.removeItem('pf-owner');
    if (localStorage.getItem('pf-owner') === '1') EP = '';
  } catch (e) {}
  var rid = function () { return (Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 20); };
  var vid, sid;
  try { vid = localStorage.getItem('pf-vid') || rid(); localStorage.setItem('pf-vid', vid); } catch (e) { vid = rid(); }
  try { sid = sessionStorage.getItem('pf-sid') || rid(); sessionStorage.setItem('pf-sid', sid); } catch (e) { sid = rid(); }
  var queue = [], depth = -1, seen = {};
  function push(t, n, v) { queue.push({t: t, n: n || null, v: v == null ? null : String(v), at: Date.now()}); if (queue.length > 40) flush(); }
  function flush(useBeacon) {
    if (!queue.length || !EP || location.protocol === 'file:') { queue.length = 0; return; }
    var now = Date.now(), ev = queue.splice(0, queue.length).map(function (e) { return {t: e.t, n: e.n, v: e.v, a: now - e.at}; });
    var body = JSON.stringify({v: vid, s: sid, p: location.pathname, r: document.referrer || null, sw: screen.width, sh: screen.height, l: navigator.language, ev: ev});
    var url = EP.replace(/\/$/, '') + '/e';
    if (useBeacon && navigator.sendBeacon) { navigator.sendBeacon(url, new Blob([body], {type: 'text/plain'})); return; }
    try { fetch(url, {method: 'POST', body: body, keepalive: true, headers: {'content-type': 'text/plain'}}).catch(function () {}); } catch (e) {}
  }
  window.pfTrack = function (n, v) { push('act', n, v); };
  push('view');
  setInterval(function () { if (document.visibilityState === 'visible') push('hb'); }, 15000);
  setInterval(flush, 8000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(true); });
  addEventListener('pagehide', function () { flush(true); });

  // events from the 3D room (scroll scenes, entering, reaching the end)
  window.__pfBus = function (n, e) {
    if (n === 'enter') push('sys', 'enter');
    else if (n === 'shot' && e && e.index > depth) { depth = e.index; push('sys', 'shot', depth); }
    else if (n === 'loop') push('sys', 'loop');
  };
  // which interactive point / project is open
  var open = {};
  function check() {
    var st = {cam: !!document.querySelector('.ts-cam'), booth: !!document.querySelector('.ts-booth-full'), system: !!document.querySelector('.ts-crt')};
    Object.keys(st).forEach(function (k) { if (st[k] && !open[k]) push('act', 'open', k); open[k] = st[k]; });
    var f = document.querySelector('.ts-crt iframe[title]'), t = f && f.getAttribute('title');
    if (t && t !== open.project) push('act', 'project', t);
    open.project = t || null;
  }
  new MutationObserver(check).observe(document.documentElement, {childList: true, subtree: true});
  // messages from the embedded scenes (photo sphere, phone booth, ID card)
  addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d !== 'object') return;
    if (d.type === 'pf-track' && d.n) {
      var k = d.n + ':' + d.v;
      if (d.n === 'shoot_media' && seen[k]) return; seen[k] = 1;
      push('act', String(d.n).slice(0, 40), d.v);
    }
    if (d.type === 'idcard' && d.state === 'gone' && !seen.idcard) { seen.idcard = 1; push('act', 'idcard', 'tap'); }
  });
})();
    </script>

    <!-- Creative License card intro: flies in, tap it to slide it away, then the portfolio's Enter runs -->
    <style>
      #idcard-intro { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 100; background: #05060a; transition: opacity .45s ease; }
      #idcard-intro.gone { opacity: 0; pointer-events: none; }

      html.idcard-on #boot { opacity: 0 !important; }
    </style>
    <script>
      (function () {
        var root = document.documentElement, frame = document.createElement('iframe');
        root.classList.add('idcard-on');
        frame.id = 'idcard-intro'; frame.src = 'idcard/index.html'; frame.title = 'Creative License'; frame.allow = 'autoplay';
        document.body.appendChild(frame);
        function finish() { frame.classList.add('gone'); setTimeout(function () { frame.remove(); }, 600); }
        function enter() {
          var started = Date.now();
          (function attempt() {
            var btn = document.querySelector('.ts-entry button');
            if (btn && !btn.disabled) {
              btn.click();                                   // same as pressing Enter: the room starts and the ball drops
              finish();
              setTimeout(function () { root.classList.remove('idcard-on'); }, 1600);
            } else if (Date.now() - started < 4000) {
              setTimeout(attempt, 150);                      // scene still loading: wait a moment
            } else {
              root.classList.remove('idcard-on'); finish();  // slow load: show the loader and its Enter button
            }
          })();
        }
        // pass the room's loading progress to the card so its hint can show it
        var progress = setInterval(function () {
          if (!frame.contentWindow) return;
          var pct = document.querySelector('.ts-entry .pct'), btn = document.querySelector('.ts-entry button');
          var ready = !!(btn && !btn.disabled), m = pct && /(\d+)%/.exec(pct.textContent);
          frame.contentWindow.postMessage({type: 'idcard-progress', ready: ready, pct: m ? m[1] : 0}, '*');
          if (!document.getElementById('idcard-intro')) clearInterval(progress);
        }, 300);
        window.addEventListener('message', function (e) {
          if (e.source !== frame.contentWindow || !e.data || e.data.type !== 'idcard') return;
          if (e.data.state === 'gone') enter();
        });
      })();
    </script>

    <div id="scroll-cue" role="status" aria-live="polite"><span class="ic" aria-hidden="true"></span><span>Keep scrolling till the end</span><span class="keys" aria-label="or use the up and down arrow keys"><kbd>&uarr;</kbd><kbd>&darr;</kbd></span></div>
    <script>
      (function () {
        var cue = document.getElementById('scroll-cue'), shown = false, gone = false;
        var rotCheck = function () { document.documentElement.classList.toggle('pf-rot', !!document.querySelector('.ts-rotate-wrap')); };
        new MutationObserver(rotCheck).observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
        addEventListener('resize', rotCheck); rotCheck();
        function hide() {
          if (!shown || gone) return; gone = true; cue.classList.add('off');
          ['wheel', 'touchmove', 'keydown'].forEach(function (ev) { window.removeEventListener(ev, onInput, true); });
          setTimeout(function () { cue.remove(); }, 600);
        }
        function onInput(e) {
          if (e.type === 'keydown' && ['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', ' ', 'End', 'Home'].indexOf(e.key) < 0) return;
          if (e.type === 'wheel' && Math.abs(e.deltaY) + Math.abs(e.deltaX) < 4) return;
          hide();
        }
        window.addEventListener('pf-ball-land', function () {
          if (shown) return; shown = true;
          setTimeout(function () {
            cue.classList.add('on');
            ['wheel', 'touchmove', 'keydown'].forEach(function (ev) { window.addEventListener(ev, onInput, { capture: true, passive: true }); });
          }, 350);
        });
      })();

    <script>

    <script>
      (function () {
        var phone = window.__pfPhone = matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) <= 560;
        if (phone) window.__pfDpr = [1, 1.25];
        // arrow keys (desktop): up = forward, down = back - counted in analytics
        window.__pfKey = function (d) { try { window.pfTrack && window.pfTrack('key', d > 0 ? 'fwd' : 'back'); } catch (e) {} };
        if (!phone) return;
        var tries = 0, fixed = false;
        var t = setInterval(function () {
          var st = window.__st; if (++tries > 240) clearInterval(t);
          if (!st || !st.scene) return;
          if (!fixed) {           // the booth glass: real-time refraction re-draws the whole room a second time each frame
            var n = 0;
            st.scene.traverse(function (o) {
              if (!o.isMesh) return;
              [].concat(o.material).forEach(function (m) { if (m && m.transmission > 0) { m.transmission = 0; m.transparent = true; m.opacity = 0.2; m.depthWrite = false; m.needsUpdate = true; n++; } });
            });
            if (n) fixed = true;
          }
          if (fixed) { clearInterval(t); adapt(st); }
        }, 500);
        // adaptive resolution: drop sharpness a notch if the phone can't hold ~45 fps, raise it back when it can
        function adapt(st) {
          var dpr = 1.25, last = 0, sum = 0, cnt = 0, good = 0, bad = 0;
          (function tick(now) {
            requestAnimationFrame(tick);
            if (document.hidden || document.querySelector('.ts-embed-frame')) { last = 0; return; }
            if (last) { var d = now - last; if (d < 250) { sum += d; cnt++; } }
            last = now;
            if (cnt >= 90) {
              var avg = sum / cnt; sum = cnt = 0;
              if (avg > 22) { good = 0; if (++bad >= 2 && dpr > 1) { dpr = Math.max(1, dpr - 0.125); st.setDpr(dpr); bad = 0; } }
              else if (avg < 17.5) { bad = 0; if (++good >= 4 && dpr < 1.25) { dpr = Math.min(1.25, dpr + 0.125); st.setDpr(dpr); good = 0; } }
              else { good = bad = 0; }
            }
          })(0);
        }
      })();

        window.cancelAnimationFrame = function (id) { if (id < 0) { queue[-id - 1] = null; return; } caf(id); };

          if (!p) { var list = queue; queue = []; list.forEach(function (cb) { if (cb) raf(cb); }); }
        }
        new MutationObserver(function () { setPaused(!!document.querySelector('.ts-embed-frame')); })
          .observe(document.documentElement, { childList: true, subtree: true });
      })();

          clearInterval(t);
          var b = document.getElementById('boot');
          if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove() }, 900) }
        }
      }, 300);
    </script>
  </body>
</html>
